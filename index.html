<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>प्रोफेशनल न्यूज़ इंट्रो मेकर और डाउनलोडर</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        h1 {
            font-size: 20px;
            margin-bottom: 15px;
            color: #38bdf8;
            text-align: center;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            width: 100%;
            max-width: 950px;
            justify-content: center;
        }

        .control-panel {
            flex: 1;
            min-width: 300px;
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .control-group {
            margin-bottom: 12px;
        }

        .control-group label {
            display: block;
            font-size: 13px;
            margin-bottom: 4px;
            color: #cbd5e1;
        }

        .control-group input, .control-group select {
            width: 100%;
            padding: 9px;
            background: #0f172a;
            border: 1px solid #475569;
            color: white;
            border-radius: 6px;
            font-size: 14px;
        }

        .control-group input[type="color"] {
            height: 38px;
            cursor: pointer;
            padding: 2px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px;
            flex: 1;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            text-align: center;
        }

        .btn:hover { opacity: 0.9; }
        .btn-play { background: #16a34a; }
        .btn-download { background: #9333ea; }

        .preview-container {
            flex: 1;
            min-width: 320px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* स्टेज (जहाँ एनीमेशन दिखेगा) */
        .stage {
            width: 100%;
            height: 260px;
            background: #000000;
            border: 2px solid #334155;
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
        }

        /* अलग-अलग टेम्पलेट के डिज़ाइन */
        .intro-banner {
            width: 90%;
            padding: 12px 18px;
            display: flex;
            align-items: center;
            gap: 15px;
            border-radius: 8px;
            transform: scale(0.8);
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: absolute;
        }

        .intro-banner.animate {
            transform: scale(1);
            opacity: 1;
        }

        /* टेम्पलेट 1: ब्रेकिंग न्यूज़ बार */
        .template-1 {
            background: linear-gradient(90deg, #dc2626, #7f1d1d);
            border-left: 6px solid #facc15;
            bottom: 20px;
        }

        /* टेम्पलेट 2: स्पेशल रिपोर्ट स्टाइलिश स्ट्रिप */
        .template-2 {
            background: linear-gradient(90deg, #2563eb, #1e3a8a);
            border-radius: 30px;
            top: 20px;
        }

        /* टेम्पलेट 3: सेंटर फ्लैश इंट्रो */
        .template-3 {
            background: rgba(15, 23, 42, 0.9);
            border: 2px solid #38bdf8;
            flex-direction: column;
            text-align: center;
            justify-content: center;
        }

        .logo-box {
            width: 45px;
            height: 45px;
            background: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            flex-shrink: 0;
        }

        .logo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .text-box {
            display: flex;
            flex-direction: column;
        }

        .main-title {
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .sub-title {
            font-size: 11px;
            opacity: 0.9;
        }

        .hint {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 10px;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>🎬 मल्टी-टेम्पलेट न्यूज़ इंट्रो मेकर</h1>

    <div class="container">
        <!-- कण्ट्रोल पैनल -->
        <div class="control-panel">
            <div class="control-group">
                <label>इंट्रो डिज़ाइन (Template चुनें):</label>
                <select id="templateSelect" onchange="changeTemplate()">
                    <option value="1">टेम्पलेट 1: ब्रेकिंग न्यूज़ बार (Bottom)</option>
                    <option value="2">टेम्पलेट 2: स्पेशल रिपोर्ट (Top Curved)</option>
                    <option value="3">टेम्पलेट 3: बिग सेंट्रल फ्लैश (Center)</option>
                </select>
            </div>

            <div class="control-group">
                <label>मुख्य हेडलाइन (Main Title):</label>
                <input type="text" id="inputText" value="ब्रेकिंग न्यूज़ इंडिया" oninput="updateText()">
            </div>

            <div class="control-group">
                <label>सब-टेक्स्ट (Sub-text / Location):</label>
                <input type="text" id="inputSubText" value="सबसे तेज़, सबसे सटीक" oninput="updateText()">
            </div>

            <div class="control-group">
                <label>थीम कलर (Theme Color):</label>
                <input type="color" id="inputColor" value="#dc2626" onchange="updateColor()">
            </div>

            <div class="control-group">
                <label>अपना लोगो अपलोड करें (Logo):</label>
                <input type="file" id="inputLogo" accept="image/*" onchange="updateLogo(event)">
            </div>

            <div class="btn-group">
                <button class="btn btn-play" onclick="playAnimation()">▶ प्ले करें</button>
                <button class="btn btn-download" onclick="downloadIntro()">📥 डाउनलोड / सेव</button>
            </div>
        </div>

        <!-- लाइव प्रीव्यू -->
        <div class="preview-container">
            <div class="stage" id="stageBox">
                <!-- बैनर 1 -->
                <div class="intro-banner template-1 animate" id="banner1">
                    <div class="logo-box" id="logoPreview1">
                        <span style="font-size: 9px; color: #000; font-weight: bold;">LOGO</span>
                    </div>
                    <div class="text-box">
                        <span class="main-title" id="displayTitle1">ब्रेकिंग न्यूज़ इंडिया</span>
                        <span class="sub-title" id="displaySubText1">सबसे तेज़, सबसे सटीक</span>
                    </div>
                </div>

                <!-- बैनर 2 (शुरुआत में छुपा रहेगा) -->
                <div class="intro-banner template-2" id="banner2" style="display:none;">
                    <div class="logo-box" id="logoPreview2">
                        <span style="font-size: 9px; color: #000; font-weight: bold;">LOGO</span>
                    </div>
                    <div class="text-box">
                        <span class="main-title" id="displayTitle2">ब्रेकिंग न्यूज़ इंडिया</span>
                        <span class="sub-title" id="displaySubText2">सबसे तेज़, सबसे सटीक</span>
                    </div>
                </div>

                <!-- बैनर 3 (शुरुआत में छुपा रहेगा) -->
                <div class="intro-banner template-3" id="banner3" style="display:none;">
                    <div class="logo-box" id="logoPreview3" style="margin-bottom: 5px;">
                        <span style="font-size: 9px; color: #000; font-weight: bold;">LOGO</span>
                    </div>
                    <div class="text-box" style="align-items: center;">
                        <span class="main-title" id="displayTitle3">ब्रेकिंग न्यूज़ इंडिया</span>
                        <span class="sub-title" id="displaySubText3">सबसे तेज़, सबसे सटीक</span>
                    </div>
                </div>
            </div>
            <p class="hint">अपनी पसंद का डिज़ाइन चुनें, टेक्स्ट भरें और फ्री में इस्तेमाल करें!</p>
        </div>
    </div>

    <script>
        let currentTemp = 1;

        function updateText() {
            const tText = document.getElementById('inputText').value;
            const sText = document.getElementById('inputSubText').value;

            document.getElementById('displayTitle1').innerText = tText;
            document.getElementById('displaySubText1').innerText = sText;
            document.getElementById('displayTitle2').innerText = tText;
            document.getElementById('displaySubText2').innerText = sText;
            document.getElementById('displayTitle3').innerText = tText;
            document.getElementById('displaySubText3').innerText = sText;
        }

        function changeTemplate() {
            currentTemp = document.getElementById('templateSelect').value;
            
            document.getElementById('banner1').style.display = 'none';
            document.getElementById('banner2').style.display = 'none';
            document.getElementById('banner3').style.display = 'none';

            const activeBanner = document.getElementById(`banner${currentTemp}`);
            activeBanner.style.display = 'flex';
            playAnimation();
        }

        function updateColor() {
            const color = document.getElementById('inputColor').value;
            const activeBanner = document.getElementById(`banner${currentTemp}`);
            if(currentTemp != 3) {
                activeBanner.style.background = `linear-gradient(90deg, ${color}, #0f172a)`;
            } else {
                activeBanner.style.borderColor = color;
            }
        }

        function updateLogo(event) {
            const file = event.target.files[0];
            if (file) {
                const logoURL = URL.createObjectURL(file);
                ['1', '2', '3'].forEach(id => {
                    document.getElementById(`logoPreview${id}`).innerHTML = `<img src="${logoURL}" alt="Logo">`;
                });
            }
        }

        function playAnimation() {
            const banner = document.getElementById(`banner${currentTemp}`);
            banner.classList.remove('animate');
            setTimeout(() => {
                banner.classList.add('animate');
            }, 50);
        }

        function downloadIntro() {
            alert("सुझाव: आप इस स्क्रीनशॉट या फोन के स्क्रीन रिकॉर्डर (Screen Recorder) का उपयोग करके इस शानदार इंट्रो को वीडियो फॉर्मेट में आसानी से सेव कर सकते हैं!");
        }
    </script>
</body>
</html>
