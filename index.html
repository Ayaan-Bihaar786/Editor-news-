<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>फ्री एआई सॉन्ग और वॉइस मेकर स्टूडियो</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        h1 {
            font-size: 22px;
            margin-bottom: 20px;
            color: #38bdf8;
            text-align: center;
        }

        .container {
            width: 100%;
            max-width: 700px;
            background: #1e293b;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-size: 14px;
            color: #cbd5e1;
            font-weight: bold;
        }

        .form-group input[type="text"], .form-group select, .form-group textarea {
            width: 100%;
            padding: 12px;
            background: #0f172a;
            border: 1px solid #475569;
            color: white;
            border-radius: 8px;
            font-size: 14px;
        }

        .form-group textarea {
            resize: vertical;
            height: 100px;
        }

        .file-upload-box {
            border: 2px dashed #475569;
            padding: 15px;
            text-align: center;
            border-radius: 8px;
            background: #0f172a;
            cursor: pointer;
        }

        .file-upload-box input {
            display: none;
        }

        .upload-label {
            color: #38bdf8;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-generate {
            background: linear-gradient(90deg, #2563eb, #9333ea);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            text-align: center;
        }

        .btn-generate:hover {
            opacity: 0.9;
        }

        /* आउटपुट या प्लेयर सेक्शन */
        .output-section {
            background: #0f172a;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #334155;
            display: none;
            text-align: center;
            flex-direction: column;
            gap: 10px;
        }

        .output-section audio {
            width: 100%;
            margin-top: 10px;
        }

        .loading-text {
            color: #facc15;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>🎶 एआई सॉन्ग और वॉइस स्टूडियो क्रिएटर</h1>

    <div class="container">
        
        <!-- 1. लिखकर गाना बनाने के लिए (Lyrics / Prompt) -->
        <div class="form-group">
            <label>गाना लिखने के लिए टेक्स्ट या आइडिया दर्ज करें (Lyrics / Theme):</label>
            <textarea id="songLyrics" placeholder="यहाँ अपने गाने के बोल या थीम लिखें (जैसे: मेरे गाँव चपहरी पर एक प्यारा सा गीत...)"></textarea>
        </div>

        <!-- 2. म्यूजिक स्टाइल चुनना -->
        <div class="form-group">
            <label>संगीत की शैली (Music Style):</label>
            <select id="musicStyle">
                <option value="pop">पॉप (Pop)</option>
                <option value="hiphop">हिप-हॉप / रैप (Hip-Hop / Rap)</option>
                <option value="romantic">रोमांटिक मेलोडी (Romantic Melody)</option>
                <option value="folk">लोक संगीत / फोक (Folk / Desi)</option>
                <option value="rock">रॉक (Rock)</option>
            </select>
        </div>

        <!-- 3. वॉइस / ऑडियो फाइल इंपोर्ट करने के लिए -->
        <div class="form-group">
            <label>अपनी आवाज़ या ऑडियो फाइल इंपोर्ट करें (Optional Voice Import):</label>
            <div class="file-upload-box" onclick="document.getElementById('voiceFile').click()">
                <p id="fileNameDisplay">वॉइस या ऑडियो फाइल यहाँ अपलोड करें (MP3, WAV)</p>
                <input type="file" id="voiceFile" accept="audio/*" onchange="handleFileSelect(event)">
            </div>
        </div>

        <!-- प्रोसेस बटन -->
        <button class="btn-generate" onclick="generateSong()">✨ गाना और वोकल मिक्स करें</button>

        <!-- रिजल्ट / प्लेयर बॉक्स -->
        <div class="output-section" id="outputSection">
            <p class="loading-text" id="statusText">प्रोसेसिंग जारी है...</p>
            <div id="playerContainer" style="display:none;">
                <p style="color: #4ade80; font-weight: bold;">आपका कस्टम गाना तैयार है!</p>
                <audio id="audioPlayer" controls></audio>
            </div>
        </div>

    </div>

    <script>
        let importedAudioURL = null;

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (file) {
                document.getElementById('fileNameDisplay').innerText = "चयनित फाइल: " + file.name;
                importedAudioURL = URL.createObjectURL(file);
            }
        }

        function generateSong() {
            const lyrics = document.getElementById('songLyrics').value;
            const outputSection = document.getElementById('outputSection');
            const statusText = document.getElementById('statusText');
            const playerContainer = document.getElementById('playerContainer');
            const audioPlayer = document.getElementById('audioPlayer');

            if (!lyrics.trim() && !importedAudioURL) {
                alert("कृपया पहले कुछ लिरिक्स लिखें या अपनी आवाज़ (ऑडियो) इंपोर्ट करें!");
                return;
            }

            outputSection.style.display = 'flex';
            statusText.style.display = 'block';
            playerContainer.style.display = 'none';
            statusText.innerText = "एआई आपके लिरिक्स और वॉइस को सिंथेसाइज कर रहा है...";

            // सिम्युलेटेड प्रोसेस (3 सेकंड बाद गाना तैयार दिखाना)
            setTimeout(() => {
                statusText.style.display = 'none';
                playerContainer.style.display = 'block';

                // अगर यूजर ने खुद की ऑडियो फाइल डाली है, तो उसे चलाएं, वरना डिफॉल्ट सैंपल या सिंथेसिस प्ले करें
                if (importedAudioURL) {
                    audioPlayer.src = importedAudioURL;
                } else {
                    // यदि केवल लिखकर बनाया गया है, तो एक डेमो या सिंथेसाइज्ड टोन सेट करें
                    audioPlayer.src = "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3";
                }
            }, 3000);
        }
    </script>
</body>
</html>
